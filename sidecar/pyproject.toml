[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grc-sidecar"
version = "0.1.0"
description = "Local-first, air-gapped intelligence sidecar for GRC Second Brain."
requires-python = ">=3.11,<3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "sqlite-vec==0.1.9",
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
    "types-openpyxl==3.1.5.20260827",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"grc_sidecar.reality" = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]

# sqlite-vec ships no type information (no py.typed). Everything else stays strict; the few calls
# into it are wrapped in typed functions in repositories/sqlite_vec_repo.py.
[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `ollama` need a real local Ollama. They are deselected (not skipped, so the CI skip
# check stays intact) unless asked for: `pytest -m ollama`.
addopts = "-ra --strict-markers --strict-config -m 'not ollama'"
markers = ["ollama: needs a running local Ollama with the embedding model installed (live check)"]
filterwarnings = ["error"]
