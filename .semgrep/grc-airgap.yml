# Project-specific Semgrep rules that encode the CLAUDE.md air-gap protocol.
# Used by CI (semgrep scan --config .semgrep/) and by CodeRabbit (tools.semgrep.config_file).
rules:
  # ---------- Python: no shell execution ----------
  - id: grc-py-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: "shell=True is forbidden (CLAUDE.md 3.5). Pass an argument list with shell=False."
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: grc-py-os-shell
    languages: [python]
    severity: ERROR
    message: "os.system/os.popen spawn a shell (CLAUDE.md 3.5). Use subprocess.run([...], shell=False)."
    pattern-either:
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: grc-py-eval-exec
    languages: [python]
    severity: ERROR
    message: "eval/exec are forbidden (CLAUDE.md 3.5)."
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  # ---------- Python: loopback only ----------
  - id: grc-py-bind-all-interfaces
    languages: [python]
    severity: ERROR
    message: "Servers must bind to 127.0.0.1 only (CLAUDE.md 3.3)."
    pattern-either:
      - pattern: uvicorn.run(..., host="0.0.0.0", ...)
      - pattern: uvicorn.run(..., host="::", ...)
      - pattern: uvicorn.Config(..., host="0.0.0.0", ...)
      - pattern: uvicorn.Config(..., host="::", ...)

  # ---------- Python: egress choke point ----------
  - id: grc-py-httpx-client-outside-factory
    languages: [python]
    severity: ERROR
    message: "Create HTTP clients only via grc_sidecar.security.net (CLAUDE.md 3.2). Direct httpx clients bypass loopback and proxy controls."
    paths:
      exclude:
        - "**/security/net.py"
        - "**/tests/**"
    pattern-either:
      - pattern: httpx.Client(...)
      - pattern: httpx.AsyncClient(...)

  - id: grc-py-httpx-trust-env
    languages: [python]
    severity: ERROR
    message: "httpx clients must set trust_env=False so proxy env vars cannot redirect traffic (CLAUDE.md 3.2)."
    pattern-either:
      - patterns:
          - pattern: httpx.AsyncClient(...)
          - pattern-not: httpx.AsyncClient(..., trust_env=False, ...)
      - patterns:
          - pattern: httpx.Client(...)
          - pattern-not: httpx.Client(..., trust_env=False, ...)

  - id: grc-py-module-level-http
    languages: [python]
    severity: ERROR
    message: "Module-level HTTP helpers bypass the client factory (CLAUDE.md 3.2)."
    pattern-either:
      - pattern: urllib.request.urlopen(...)
      - patterns:
          - pattern-either:
              - pattern: httpx.$M(...)
              - pattern: requests.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|head|options|request|stream)$

  - id: grc-py-forbidden-network-imports
    languages: [python]
    severity: ERROR
    message: "Cloud AI / hosted service SDKs are forbidden (CLAUDE.md 3.1)."
    patterns:
      - pattern-either:
          - pattern: import $MOD
          - pattern: from $MOD import $X
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(openai|anthropic|google\.generativeai|google\.genai|pinecone|cohere|langsmith|langchain_openai|langchain_anthropic|boto3|requests)(\..*)?$

  - id: grc-py-ollama-pull
    languages: [python]
    severity: ERROR
    message: "The app must never download models (CLAUDE.md 3.7). The runtime control is the endpoint allowlist in llm/ollama_embeddings.py; this rule catches the spellings a regex can see: with or without the leading slash, any case, doubled slashes, dot segments, a percent-encoded p, and a .pull() call. Computed paths (split strings, f-strings, data) are caught by the AST test in test_dependency_hygiene.py and, ultimately, by the allowlist."
    pattern-either:
      - pattern-regex: '(?i)api/+(\./+)*(p|%70)ull\b'
      - pattern: $CLIENT.pull(...)

  # ---------- Python: one module may name the chat endpoint (ADR-012) ----------
  - id: grc-py-chat-endpoint-outside-generation-client
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/llm/generation_client.py may name the Ollama chat endpoint (ADR-012). That module holds the endpoint allowlist, the exactly-two-messages rule, shift:false, the model gate and the fixed-message errors; a second caller would bypass all of them. Spellings caught: with or without the leading slash, any case, doubled slashes and dot segments."
    paths:
      exclude:
        - "**/llm/generation_client.py"
        - "**/tests/**"
    pattern-regex: '(?i)api/+(\./+)*chat\b'

  # ---------- Python: one module may read a workbook (ADR-014) ----------
  - id: grc-py-load-workbook-outside-loader
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/questionnaire/loader.py may call openpyxl's load_workbook (ADR-014). That module reads the file once, hashes the bytes, runs the package scan (size caps counted on decompressed bytes, DOCTYPE and ENTITY search in every part) and then parses those same bytes; a second caller would parse a workbook nobody scanned."
    paths:
      exclude:
        - "**/questionnaire/loader.py"
        - "**/tests/**"
    pattern-regex: '\bload_workbook\b'

  # ---------- Python: one package may read a CSV (ADR-016) ----------
  - id: grc-py-csv-outside-reality
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/reality/ may import the csv module (ADR-016 decision 12). The reality check's export reader reads the file once in chunks, hashes and decodes the same bytes, caps size, rows and field length, refuses encodings and NUL characters and keeps four fields per row; a second csv reader would parse an untrusted export, which holds personal data, without any of that. Spellings caught: import csv, import csv as x, from csv import y, and csv as one item of a comma list (import os, csv). The AST test test_csv_is_imported_only_under_reality is the second layer and also sees __import__ and importlib."
    paths:
      exclude:
        - "**/reality/**"
        - "**/tests/**"
    pattern-regex: '(?m)^[ \t]*(?:import[ \t]+(?:[\w.]+(?:[ \t]+as[ \t]+\w+)?[ \t]*,[ \t]*)*csv\b|from[ \t]+csv\b)'

  # ---------- Python: the questionnaire engine writes one way only (ADR-014) ----------
  # These four rules are scoped to the questionnaire package (and to the rule fixtures, so that
  # `semgrep --test` can see them). The writer is the only module that may save a workbook or
  # remove a file, and nothing in the package may write a file except by exclusive create.
  - id: grc-py-workbook-save-outside-writer
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/questionnaire/writer.py may save a workbook (ADR-014). It builds the workbook, saves it to memory, reads it back and compares it, re-hashes the input, creates the file exclusively and checks it again; a second save call would skip all of that."
    paths:
      include:
        - "**/questionnaire/**"
        - ".semgrep/fixtures/grc-airgap.py"
      exclude:
        - "**/questionnaire/writer.py"
    pattern-regex: '\.save\('

  - id: grc-py-questionnaire-file-write-call
    languages: [python]
    severity: ERROR
    message: "The questionnaire package never writes a file with write_bytes, write_text, os.replace, os.rename, shutil.copy* or shutil.move (ADR-014). Those overwrite or replace an existing file. The only write is the writer's exclusive create (open(path, 'xb')), which fails if anything of that name exists."
    paths:
      include:
        - "**/questionnaire/**"
        - ".semgrep/fixtures/grc-airgap.py"
    pattern-regex: '\.(?:write_bytes|write_text)\(|\bos\.(?:replace|rename)\(|\bshutil\.(?:copy\w*|move)\('

  - id: grc-py-questionnaire-open-mode
    languages: [python]
    severity: ERROR
    message: "In the questionnaire package open() may only use mode 'rb' (read) or 'xb' (exclusive create) (ADR-014). Modes such as 'w', 'wb', 'a' or 'r+' overwrite or change an existing file; the input workbook must never be written to and an existing output must never be replaced."
    paths:
      include:
        - "**/questionnaire/**"
        - ".semgrep/fixtures/grc-airgap.py"
    pattern-regex: '\bopen\((?:[^()\n]|\([^()\n]*\))*?,\s*(?:mode\s*=\s*)?["'']((?!rb["''])(?!xb["''])[^"'']*)["'']|\.open\(\s*["''](?!rb["''])(?!xb["''])'

  - id: grc-py-questionnaire-delete-outside-writer
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/questionnaire/writer.py may remove a file (ADR-014), and only the one file it has just created when the read-back does not match. Removing files anywhere else in the questionnaire package could remove a user's workbook."
    paths:
      include:
        - "**/questionnaire/**"
        - ".semgrep/fixtures/grc-airgap.py"
      exclude:
        - "**/questionnaire/writer.py"
    pattern-regex: '\bos\.(?:remove|unlink)\(|\.unlink\('

  # ---------- Python: frontmatter and vault content are untrusted (CLAUDE.md 8.6) ----------
  - id: grc-py-yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: "yaml.load and the full/unsafe loaders can construct arbitrary Python objects from untrusted text. Use the strict loader in grc_sidecar.vault.frontmatter (a SafeLoader subclass), never yaml.load (CLAUDE.md 8.6)."
    pattern-either:
      - patterns:
          - pattern: yaml.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(load|load_all|unsafe_load|unsafe_load_all|full_load|full_load_all|Loader|FullLoader|UnsafeLoader|CLoader|CFullLoader|CUnsafeLoader)$
      - patterns:
          - pattern: from yaml import $NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(load|load_all|unsafe_load|unsafe_load_all|full_load|full_load_all|Loader|FullLoader|UnsafeLoader|CLoader|CFullLoader|CUnsafeLoader)$

  # ---------- Python: the vector store is the only place that touches SQLite (ADR-001) ----------
  - id: grc-py-sqlite-outside-repositories
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/repositories/ may import sqlite3 or sqlite_vec (ADR-001). Everything else uses the VectorRepository protocol."
    paths:
      exclude:
        - "**/repositories/**"
        - "**/tests/**"
    pattern-either:
      - pattern: import sqlite3
      - pattern: import sqlite3.$SUB
      - pattern: from sqlite3 import $X
      - pattern: import sqlite_vec
      - pattern: from sqlite_vec import $X

  # Loading a native library runs arbitrary code inside the sidecar. The process guard allows
  # exactly one extension (ADR-007 amendment); this rule keeps the call sites in one reviewed module.
  - id: grc-py-extension-load-outside-repositories
    languages: [python]
    severity: ERROR
    message: "Native SQLite extensions are loaded only in grc_sidecar/repositories/ and only the vendored sqlite-vec (ADR-007 amendment)."
    paths:
      exclude:
        - "**/repositories/**"
        - "**/tests/**"
    pattern-either:
      - pattern: $CON.load_extension(...)
      - pattern: $CON.enable_load_extension(...)
      - pattern: sqlite_vec.load(...)

  # The promise ledger is append-only (ADR-017 decision 8). Its repository has no method that
  # changes or removes a row, and a trigger on every table aborts one. This rule keeps SQL that
  # does either out of every other module. Case-sensitive on purpose: the codebase writes SQL
  # keywords in upper case, and prose such as "we never update customer names" must not trip it.
  - id: grc-py-ledger-mutation-outside-ledger
    languages: [python]
    severity: ERROR
    message: "No UPDATE, DELETE or replace statement against a ledger table may appear outside grc_sidecar/repositories/sqlite_ledger_repo.py (ADR-017 decision 8). The ledger is append-only: record a correction as a new event."
    paths:
      exclude:
        - "**/repositories/sqlite_ledger_repo.py"
        - "**/tests/**"
    pattern-regex: '\b(UPDATE|DELETE\s+FROM|INSERT\s+OR\s+REPLACE\s+INTO|REPLACE\s+INTO)\s+(run_record|run_answer|customer|promise|promise_event|schema_info)\b'

  # ---------- Python: the contradiction detector (ADR-019, F33-6) ----------
  # Two rules, because a rule's `paths` apply to the whole rule. The package may import no network
  # or process module in ANY file, not even the model module; it may import the llm package only in
  # verdict.py. The AST test test_contradiction_hygiene.py is the second layer and also sees
  # __import__ and importlib. Scoped to the package and to the rule fixtures, so `semgrep --test`
  # can see them (the fixture's own top-level imports are annotated for this rule).
  - id: grc-py-contradictions-network-process-import
    languages: [python]
    severity: ERROR
    message: "Nothing under grc_sidecar/contradictions/ may import a network or process module, httpx, or grc_sidecar.security.net (ADR-019, F33-6). The detector talks to the model only through the generation client that is passed in to verdict.py; a second path would bypass the endpoint allowlist, the model gate and the exactly-two-messages rule (ADR-012)."
    paths:
      include:
        - "**/contradictions/**"
        - ".semgrep/fixtures/grc-airgap.py"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import $MOD
              - pattern: from $MOD import $X
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(socket|ssl|http|urllib|httpx|requests|subprocess|multiprocessing|ctypes|asyncio\.subprocess|grc_sidecar\.security\.net)(\..*)?$
      - pattern: from grc_sidecar.security import net
      - pattern: from asyncio import subprocess

  - id: grc-py-contradictions-llm-outside-model-module
    languages: [python]
    severity: ERROR
    message: "Only grc_sidecar/contradictions/verdict.py may import the grc_sidecar.llm package (ADR-019 decision 11). That module builds the two messages, applies the shared two-attempt budget and re-verifies the model's quotes; the status code, the pair code and the route must only ever see its validated result."
    paths:
      include:
        - "**/contradictions/**"
        - ".semgrep/fixtures/grc-airgap.py"
      exclude:
        - "**/contradictions/verdict.py"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import $MOD
              - pattern: from $MOD import $X
          - metavariable-regex:
              metavariable: $MOD
              regex: ^grc_sidecar\.llm(\..*)?$
      - pattern: from grc_sidecar import llm

  # ---------- Rust: no shell ----------
  - id: grc-rs-shell-command
    languages: [rust]
    severity: ERROR
    message: "Spawning a shell is forbidden (CLAUDE.md 3.5). Invoke the target binary directly with args."
    patterns:
      - pattern-either:
          - pattern: Command::new($BIN)
          - pattern: std::process::Command::new($BIN)
      - metavariable-regex:
          metavariable: $BIN
          regex: (?i)^"(cmd|cmd\.exe|powershell|powershell\.exe|pwsh|sh|bash|zsh)"$

  # The Tauri shell plugin gives the WEBVIEW a way to start processes. The host starts the sidecar
  # itself with std::process (M2 plan section 5), so the plugin is never needed.
  - id: grc-rs-tauri-shell-plugin
    languages: [rust]
    severity: ERROR
    message: "tauri_plugin_shell is forbidden: it exposes process execution to the frontend (CLAUDE.md 3.5, least-privilege capabilities). Spawn with std::process::Command from host code."
    pattern-regex: tauri_plugin_shell

  # A child started without env_clear() inherits the host's whole environment, including proxy
  # variables and anything the user has exported. The sidecar's environment is an allowlist built by
  # child_env.rs (CLAUDE.md 3.4/3.5). An `x.env_clear();` statement in the same block as the
  # Command, or in a block that encloses it (function body, `if`, `match` arm), satisfies the rule;
  # so does the chained form `Command::new(..).env_clear()`. The fixtures cover each placement.
  # Known limit: it does not check which Command the call is on, so one env_clear() would excuse a
  # second Command in the same block; the host builds exactly one Command per function (spawn.rs),
  # which review keeps true.
  - id: grc-rs-command-without-env-clear
    languages: [rust]
    severity: ERROR
    message: "A Command must be paired with an .env_clear() call in the same or an enclosing block, so the child gets an explicit allowlist instead of the host's environment (CLAUDE.md 3.4/3.5)."
    patterns:
      - pattern-either:
          - pattern: Command::new(...)
          - pattern: std::process::Command::new(...)
      - pattern-not-inside: |
          {
            ...
            $C.env_clear();
            ...
          }

  # dbg! prints any value with {:#?}. Debug-printing a Command (or a struct holding one) would print
  # its environment, including the auth token. clippy's dbg_macro lint says the same on every build.
  - id: grc-rs-dbg-macro
    languages: [rust]
    severity: ERROR
    message: "dbg! Debug-prints arbitrary values and can leak the auth token; use a log macro with explicit, non-secret fields (ADR-004 review rule)."
    pattern: dbg!(...)

  # The string forms ("0.0.0.0:80", "[::]:80") and the typed forms (Ipv4Addr::UNSPECIFIED,
  # Ipv4Addr::new(0, 0, 0, 0), Ipv6Addr::UNSPECIFIED, a [0, 0, 0, 0] socket address), each bare and
  # with the std::net:: prefix. `IpAddr::V4(Ipv4Addr::UNSPECIFIED)` contains the typed form.
  - id: grc-rs-bind-all-interfaces
    languages: [rust]
    severity: ERROR
    message: "Bind to 127.0.0.1 only (CLAUDE.md 3.3)."
    pattern-either:
      - pattern-regex: '"(0\.0\.0\.0|\[::\]|::)(:\d+)?"'
      - pattern: Ipv4Addr::UNSPECIFIED
      - pattern: std::net::Ipv4Addr::UNSPECIFIED
      - pattern: Ipv4Addr::new(0, 0, 0, 0)
      - pattern: std::net::Ipv4Addr::new(0, 0, 0, 0)
      - pattern: Ipv6Addr::UNSPECIFIED
      - pattern: std::net::Ipv6Addr::UNSPECIFIED
      - pattern: SocketAddr::from(([0, 0, 0, 0], $PORT))
      - pattern: std::net::SocketAddr::from(([0, 0, 0, 0], $PORT))

  # Every reqwest client must be built with `.no_proxy()` so proxy environment variables cannot
  # redirect traffic (CLAUDE.md 3.2). The only client in the host is built in health.rs. The
  # convenience constructors build a default client (which reads the proxy environment) and give no
  # place for `.no_proxy()`, so they are forbidden outright, as is the blocking client.
  # Known limit: the chain rule needs `reqwest::Client::builder()`/`ClientBuilder::new()` written
  # out in one expression; a builder stored in a variable and finished elsewhere is not followed.
  # No type information is available, so a `Client` imported from another crate would match too;
  # the host has none.
  - id: grc-rs-reqwest-without-no-proxy
    languages: [rust]
    severity: ERROR
    message: "A reqwest client must be built with `.no_proxy()` in the same builder chain (CLAUDE.md 3.2). `Client::new()`, `Client::default()`, `reqwest::get()` and `reqwest::blocking` are forbidden: they read the proxy environment."
    patterns:
      - pattern-either:
          - pattern: reqwest::Client::builder(). ... .build()
          - pattern: Client::builder(). ... .build()
          - pattern: reqwest::ClientBuilder::new(). ... .build()
          - pattern: ClientBuilder::new(). ... .build()
          - pattern: reqwest::Client::new()
          - pattern: reqwest::Client::default()
          - pattern: reqwest::get(...)
          - pattern: reqwest::blocking::$TYPE::$FUNCTION(...)
          - pattern: reqwest::blocking::$FUNCTION(...)
          - pattern: use reqwest::blocking::$ITEM;
      - pattern-not: reqwest::Client::builder(). ... .no_proxy(). ... .build()
      - pattern-not: Client::builder(). ... .no_proxy(). ... .build()
      - pattern-not: reqwest::ClientBuilder::new(). ... .no_proxy(). ... .build()
      - pattern-not: ClientBuilder::new(). ... .no_proxy(). ... .build()

  # A string literal that names a network address must name 127.0.0.1 or [::1] (CLAUDE.md 3.2 and
  # 11). `localhost` is flagged too: it is a name that has to be resolved. Only http, https, ws and
  # wss URLs are looked at. This sees string literals, not computed URLs, and not comments.
  - id: grc-rs-non-loopback-url
    languages: [rust]
    severity: ERROR
    message: "Application code may only contact 127.0.0.1 or [::1] (CLAUDE.md 3.2). Use LoopbackEndpoint (health.rs) instead of writing a URL."
    patterns:
      - pattern: '"$URL"'
      - metavariable-regex:
          metavariable: $URL
          regex: ^(https?|wss?)://(?!(127\.0\.0\.1|\[::1\])([:/]|$))

  # ---------- TypeScript / React ----------
  - id: grc-ts-dangerously-set-inner-html
    languages: [typescript]
    severity: ERROR
    message: "Raw HTML injection is forbidden. Render text through React, or sanitize in a reviewed helper."
    pattern-either:
      - pattern: <$EL dangerouslySetInnerHTML={$X} />
      - pattern: <$EL dangerouslySetInnerHTML={$X}>$CHILD</$EL>
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X

  - id: grc-ts-external-fetch
    languages: [typescript]
    severity: ERROR
    message: "The frontend must not call external URLs (CLAUDE.md 3.2). Use Tauri IPC commands."
    patterns:
      - pattern: fetch("$URL", ...)
      - metavariable-regex:
          metavariable: $URL
          regex: ^https?://(?!(127\.0\.0\.1|localhost|ipc\.localhost|\[::1\])([:/]|$))
