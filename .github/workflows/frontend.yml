name: frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in apps/desktop/package.json, so CI uses the
      # same pnpm as local development.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json

      # No dependency cache: the install is small, and a cache is one more thing that can be poisoned.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree. pnpm blocks
      # dependency install scripts by default; none are approved in this repository.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The checks below are independent, so each runs even if an earlier one failed.
      - name: Lint (ESLint, no-explicit-any is an error, Node globals only in scripts/)
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Types (tsc, strict + noUncheckedIndexedAccess)
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # `pnpm test` is plain `vitest run`, which fails when there are no test files. The JSON report
      # lets the guard below check that tests really ran.
      - name: Tests (vitest)
        if: ${{ !cancelled() }}
        run: pnpm test --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"

      # Proves the zero-test guard can fail (an empty suite, an all-skipped suite, a missing or
      # malformed report), so the guard below is not itself a hollow check.
      - name: Self-test the zero-test guard
        if: ${{ !cancelled() }}
        run: node scripts/check-test-count.selftest.mjs

      # Fails if the report is missing or unreadable, or if no test passed or failed (zero tests,
      # or every test skipped). Writes the counts to the job summary.
      - name: Guard - at least one frontend test ran
        if: ${{ !cancelled() }}
        run: node scripts/check-test-count.mjs "$RUNNER_TEMP/vitest.json"

      # Sends the package names and versions in pnpm-lock.yaml to the npm audit endpoint.
      - name: Known-vulnerability scan (pnpm audit)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high
