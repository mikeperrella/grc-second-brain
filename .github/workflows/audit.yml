name: audit

# New security advisories appear without any change to our code, so a pull request check cannot
# be the only one. This workflow re-runs the dependency audits once a week, and on demand.
# Each ecosystem is its own job, so one advisory does not hide the others.
#
# Scheduled and manually dispatched workflows only run from the default branch (main), so those
# two triggers are first exercised after the merge. The pull_request trigger below is limited to
# edits of this very file, so a change here is tested in its own pull request without running
# on every other pull request (python.yml, frontend.yml and rust.yml already run the same audits
# on every change).
#
# A failed scheduled run is reported by GitHub's notifications to the repository owner.

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC, off the busy top-of-the-hour slots
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit.yml"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-pip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # pip-audit lives in its own virtualenv. It sends only the pinned package names and
      # versions in constraints.txt to the PyPI vulnerability API. Same command as python.yml.
      - name: Known-vulnerability scan (pip-audit)
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" --strict --no-deps --disable-pip --progress-spinner off -r sidecar/constraints.txt

  audit-pnpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Sends the package names and versions in pnpm-lock.yaml to the npm audit endpoint.
      - name: Known-vulnerability scan (pnpm audit)
        run: pnpm audit --audit-level high

  audit-cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same deny.toml as rust.yml, so the Windows-only scope in ADR-003 applies here too.
      # The action's image bundles cargo-deny 0.20.2 and fetches the RustSec advisory database
      # from GitHub; no login or token is used.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --config apps/desktop/src-tauri/deny.toml
