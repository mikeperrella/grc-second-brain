name: airgap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: airgap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every container run below uses these. `--network none` removes all network interfaces
  # except loopback. The rest limits what a compromised test could do: no capabilities, no
  # privilege escalation, a read-only root filesystem, and a writable /tmp that lives in memory.
  HARDENED: >-
    --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp

jobs:
  airgap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The decision logic of the canary is plain Python and needs no network or container.
      - name: Canary logic tests
        run: python3 -m unittest discover -s sidecar/ci -p "test_*.py" -v

      # The only step that uses the network: pip installs the pinned dependencies into the image.
      - name: Build the test image (network allowed)
        run: docker build -f sidecar/Dockerfile.airgap -t grc-airgap sidecar

      # Loopback must connect, a public address and DNS must fail. A canary that cannot connect
      # to loopback exits 2 ("broken canary") instead of passing.
      - name: Canary (no network)
        run: docker run --rm $HARDENED grc-airgap python ci/airgap_canary.py

      # The full suite, still with no network. Its own egress guard stays on as a second layer.
      # -p no:cacheprovider: the root filesystem is read-only, so pytest cannot write .pytest_cache.
      # The junit file goes to /tmp (in memory); the skip check is mounted read-only from the repo
      # and runs in the same container, because the container and its /tmp are gone afterwards.
      # Linux accepts only the Windows-only path skips, as in python.yml.
      - name: Sidecar tests (no network)
        run: |
          docker run --rm $HARDENED -v "$GITHUB_WORKSPACE/.github/scripts:/ci-scripts:ro" grc-airgap sh -c '
            python -m pytest -rs -p no:cacheprovider --junitxml=/tmp/junit.xml
            pytest_status=$?
            python /ci-scripts/check_junit_skips.py /tmp/junit.xml --allow "Windows-only path behavior"
            skips_status=$?
            [ "$pytest_status" -eq 0 ] && [ "$skips_status" -eq 0 ]
          '
