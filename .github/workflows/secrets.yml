name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every past commit is scanned
          persist-credentials: false

      # Same version as the local pre-commit hook. Built from source; the Go module
      # checksum database verifies every dependency. (v8.30.1 still declares its
      # original module path, zricethezav/gitleaks.)
      - name: Install gitleaks v8.30.1
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Fails the job if gitleaks cannot detect a freshly generated fake secret, or
      # flags clean input. Nothing secret-looking is ever committed.
      - name: Scanner self-test
        run: python3 .github/scripts/gitleaks_selftest.py

      - name: Scan full git history
        run: gitleaks git --redact --no-banner --exit-code 1 .
