name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # Windows is the shipping platform, and M2's Windows-only code (Job Object, cfg(windows))
    # would be invisible to clippy on Linux. It also needs no apt packages (GTK, webkit2gtk).
    # Windows minutes are billed at twice the Linux rate on a private repository.
    # rust-toolchain.toml pins 1.99.0, so rustup installs exactly that toolchain, with rustfmt
    # and clippy, on the first cargo call.
    # Pinned to the OS-versioned label, like ubuntu-24.04, so the runner changes only when we change
    # this line. Since the June 2026 migration `windows-2025` serves Windows Server 2025 with VS 2026
    # (run log 2026-10-08: "Image: windows-2025-vs2026"). `windows-2025-vs2026` itself is a validation
    # label for that migration and could be retired, which would leave the job queued with no runner.
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checks are independent, so each runs even if an earlier one failed.
      - name: Formatting (cargo fmt --check)
        run: cargo fmt --check

      - name: Lint (cargo clippy -D warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Unit and integration tests (the fake-sidecar and Job Object suites). The one #[ignore]d
      # test, which needs the real Python sidecar, runs in its own steps below.
      - name: Tests (cargo test)
        if: ${{ !cancelled() }}
        run: cargo test --locked

      # The real Python sidecar, started through the same code the app uses (tests/real_sidecar.rs;
      # ADR-004). It is #[ignore]d because it needs sidecar/.venv, so plain `cargo test` skips it and
      # these three steps run it. Same interpreter version and pinned constraints as windows.yml.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.11"

      - name: Create the sidecar venv (runtime dependencies only)
        if: ${{ !cancelled() }}
        working-directory: sidecar
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --disable-pip-version-check -c constraints.txt -e .

      # `set -o pipefail` makes a failing cargo test fail the step even though its output goes
      # through tee. The grep then requires at least one passed test, so a run that executed nothing
      # (a renamed test, a filter that matches none) cannot pass.
      - name: Real sidecar test (cargo test -- --ignored)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --locked --test real_sidecar -- --ignored 2>&1 | tee "$RUNNER_TEMP/real_sidecar.log"
          grep -E "test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/real_sidecar.log"

  deny:
    # cargo-deny only reads Cargo.lock and the advisory database, so nothing is compiled and
    # Linux is enough. The checked dependency graph is the Windows one (deny.toml, ADR-003).
    # The action's image bundles cargo-deny 0.20.2 (verified at the pinned SHA).
    # It fetches the RustSec advisory database from GitHub; no login or token is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          # The action's default is "--all-features"; this keeps the CI check identical to the
          # local `cargo deny check` (default features, deny.toml next to Cargo.toml).
          arguments: --config apps/desktop/src-tauri/deny.toml
