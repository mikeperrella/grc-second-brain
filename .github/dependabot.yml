version: 2
updates:
  # pip (sidecar) is added at M1, when sidecar/pyproject.toml exists.
  # Dependabot errors on a pip entry that has no manifest to read.

  # pnpm projects use the "npm" ecosystem; Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # github-actions returns at M1.5, when the first workflow exists.
