version: 2
updates:
  - package-ecosystem: pip
    directory: /sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # pnpm projects use the "npm" ecosystem; Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Workflow actions are pinned to full commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The air-gap test image pins its base image by digest (sidecar/Dockerfile.airgap).
  # Dependabot proposes digest and patch updates. Minor and major bumps are ignored because
  # the sidecar targets Python 3.11 (requires-python = ">=3.11,<3.12"); changing it is a
  # decision for an ADR, not an automatic PR.
  - package-ecosystem: docker
    directory: /sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
